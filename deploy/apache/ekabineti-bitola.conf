<VirtualHost *:80>
    # Заменете го __DOMAIN__ со доменот на Општина Битола (на пр. ekabinet.bitola.gov.mk).
    ServerName __DOMAIN__
    DocumentRoot /var/www/ekabineti-bitola/current/public

    # Forward the bearer token to PHP-FPM (health, migrations, scheduler endpoints).
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    CGIPassAuth On

    <Directory /var/www/ekabineti-bitola/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Permissions-Policy and CSP are sent by the application (geolocation must stay allowed for 'self').
    ErrorLog ${APACHE_LOG_DIR}/ekabineti-bitola-error.log
    CustomLog ${APACHE_LOG_DIR}/ekabineti-bitola-access.log combined
</VirtualHost>
